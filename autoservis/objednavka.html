<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Objednať sa – PV Autoservis</title>
<link rel="stylesheet" href="as.css">
<style>
	/* The form's own background (Apponio), so the page and the form read as one surface. */
	.book-head, .book-sec, .book-foot { background: #F4F5F6; }
	.book-head { padding-block: 40px 24px; }
	.book-head .h1 { margin-bottom: 0; }
	.book-frame { display: block; width: 100%; height: calc(100svh - 96px); min-height: 640px; border: 0; }
	.book-alt { margin: 0; padding-block: 20px; font-size: 15px; color: var(--muted); }
	.book-alt a { color: var(--ink); text-decoration: underline; }
	@media (max-width: 760px) { .book-head { padding-block: 28px 16px; } }
</style>
</head>
<body data-page="objednavka.html">
<header id="hdr"></header>
<main>
	<section class="book-head">
		<div class="wrap">
			<h1 class="h1">Objednať sa<span class="red">.</span></h1>
		</div>
	</section>
	<section class="book-sec">
		<iframe class="book-frame" src="https://pv-autoservis.myapponio.com/" title="Rezervačný formulár PV Autoservis"></iframe>
	</section>
	<section class="book-foot">
		<div class="wrap">
			<p class="book-alt">Formulár sa nezobrazuje? <a href="https://pv-autoservis.myapponio.com/" target="_blank" rel="noopener">Otvorte ho v novom okne</a> alebo zavolajte na <a href="tel:+421910623111">+421 910 623 111</a>.</p>
		</div>
	</section>
</main>
<footer id="ftr"></footer>
<script src="as.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="motion.js"></script>
</body>
</html>
