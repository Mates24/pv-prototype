<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cenník – PV Autoservis</title>
<link rel="stylesheet" href="as.css">
<style>
	.cat { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 56px; padding-block: 64px; border-top: 1px solid var(--line); scroll-margin-top: 110px; }
	.cat h2 { margin: 0; font: 600 34px/.95 var(--cond); }
	.cat .n { font: 600 15px var(--cond); color: var(--red); display: block; margin-bottom: 18px; }
	.cat-body { min-width: 0; }
	.tip { margin-top: 20px; padding: 16px 20px; border-left: 4px solid var(--red); background: var(--grey); color: var(--ink); font-size: 15px; font-weight: 500; line-height: 1.5; display: flex; gap: 12px; align-items: flex-start; }
	.tip svg { flex: none; }
	.warn { background: var(--red); color: #fff; padding: 20px 24px; font-size: 15px; line-height: 1.5; display: flex; gap: 14px; align-items: flex-start; }
	@media (max-width: 1060px) { .cat { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
</style>
</head>
<body data-page="cennik.html">
<header id="hdr"></header>
<main>
	<section class="phero" style="border-bottom:0;padding-bottom:48px">
		<div class="wrap">
			<div class="sec-head" style="margin:0">
				<h1 class="h1 in d2">Cenník<br>služieb<span class="red">.</span></h1>
				<p class="side-note in d3">Ceny sú s DPH. Pri servise oleja a náplní uvádzame cenu práce, materiál naceníme podľa EČV vášho auta.</p>
			</div>
		</div>
	</section>
	<section style="padding-bottom:110px">
		<div class="wrap">
			<div class="warn rv" style="margin-top:40px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" aria-hidden="true" style="flex:none"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18v.5"/></svg><span>Pri dodaní vlastného materiálu zákazníkom sa cena práce navyšuje o 100 %.</span></div>
			<div id="cats"></div>
		</div>
	</section>
	<section class="sec-k" style="padding-block:96px">
		<div class="wrap" style="display:flex;flex-wrap:wrap;gap:32px;align-items:center;justify-content:space-between">
			<h2 class="h2 rv" style="font-size:clamp(28px, 3.1vw, 44px)">Termín máte<br><span style="color:var(--red-light)">za minútu</span></h2>
			<div class="rv" style="display:flex;flex-wrap:wrap;gap:12px"><a class="btn btn-red" data-book href="#">Rezervovať online</a><a class="btn btn-white" href="tel:+421910623111">0910 623 111</a></div>
		</div>
	</section>
</main>
<footer id="ftr"></footer>
<script>
( function () {
	const D = [
		{ id: 'pneu', tip: true, t: 'Výmena pneumatík s vyvážením', note: 'Cena za 4 ks', cols: [ 'Rozmer', 'Osobné auto', 'SUV' ], rows: [ [ '12″, 13″, 14″', '49 €', '59 €' ], [ '15″, 16″', '59 €', '69 €' ], [ '17″, 18″', '69 €', '79 €' ], [ '19″, 20″', '79 €', '89 €' ], [ '21″, 22″ a viac', '99 €', '109 €' ] ] },
		{ id: 'kolesa', tip: true, t: 'Výmena kolies s vyvážením', note: 'Cena za 4 ks', cols: [ 'Rozmer', 'Osobné auto', 'SUV' ], rows: [ [ '12″, 13″, 14″', '39 €', '49 €' ], [ '15″, 16″', '49 €', '59 €' ], [ '17″, 18″', '59 €', '69 €' ], [ '19″, 20″', '69 €', '79 €' ], [ '21″, 22″ a viac', '79 €', '89 €' ] ] },

		{ id: 'kontrola', t: 'Kontrola vozidla', cols: [ 'Služba', 'Cena' ], rows: [ [ 'Všeobecná kontrola vozidla', '100 €' ], [ 'Dymová skúška netesností v motorovom priestore', '30 €' ], [ 'Kontrola podvozku a náprav', '30 €' ], [ 'Kontrola nastavenia geometrie', '30 €' ], [ 'Kontrola pred STK + EK', '30 €' ], [ 'Diagnostika vozidla – autodiagnostika', '30 €' ], [ 'Kontrola motorového priestoru', '30 €' ], [ 'Kontrola elektriky a osvetlenia vozidla', '30 €' ] ] },
		{ id: 'podvozok', t: 'Podvozok a nápravy', cols: [ 'Služba', 'Cena' ], rows: [ [ 'Kontrola podvozku a náprav', '30 €' ], [ 'Tlmiče, uloženia, pružiny, ramená, čapy, silentbloky, ložiská…<small>Individuálna cenová ponuka na prácu a materiál</small>', 'ponuka' ] ] },
		{ id: 'brzdy', t: 'Brzdy', cols: [ 'Služba', 'Cena' ], rows: [ [ 'Kontrola bŕzd', '30 €' ], [ 'Výmena brzdovej kvapaliny', '40 €' ], [ 'Predné kotúče, platničky a vodiace puzdrá', '80 €' ], [ 'Predné platničky a vodiace puzdrá', '40 €' ], [ 'Zadné kotúče, platničky a vodiace puzdrá', '80 €' ], [ 'Zadné platničky a vodiace puzdrá', '40 €' ] ] },

	];

	document.getElementById( 'cats' ).innerHTML = D.map( ( c, i ) => `<section class="cat rv" id="${ c.id }"><div><span class="n">${ String( i + 1 ).padStart( 2, '0' ) }</span><h2>${ c.t }</h2>${ c.note ? `<p class="txt" style="margin-top:12px;font-size:14px">${ c.note }</p>` : '' }</div><div class="cat-body"><div class="tscroll"><table class="ptable"><tr>${ c.cols.map( ( h ) => `<th>${ h }</th>` ).join( '' ) }</tr>${ c.rows.map( ( r ) => `<tr>${ r.map( ( v ) => `<td>${ v }</td>` ).join( '' ) }</tr>` ).join( '' ) }</table></div>${ c.tip ? TIP : '' }</div></section>` ).join( '' );

</script>
